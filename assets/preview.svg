<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Animated preview of the FLIP/ interface in a browser window">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="win"><rect x="20" y="20" width="1160" height="660" rx="16"/></clipPath>
    <clipPath id="tk"><rect x="110" y="86" width="1070" height="34"/></clipPath>
    <clipPath id="fillclip"><rect x="780" y="440" width="0" height="120"><animate attributeName="height" values="0;0;120;120;0" keyTimes="0;.3;.75;.95;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="560;560;440;440;560" keyTimes="0;.3;.75;.95;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="700" fill="#0e0f13"/>
  <g filter="url(#sh)"><rect x="20" y="20" width="1160" height="660" rx="16" fill="#1b1d23" stroke="#292c35" stroke-width="2"/></g>

  <g clip-path="url(#win)">
    <!-- browser chrome -->
    <rect x="20" y="20" width="1160" height="46" fill="#14161b"/>
    <circle cx="48" cy="43" r="6.5" fill="#FF5B23"/><circle cx="70" cy="43" r="6.5" fill="#D7FF3A"/><circle cx="92" cy="43" r="6.5" fill="#4D7CFF"/>
    <rect x="360" y="30" width="480" height="26" rx="13" fill="#0e0f13"/>
    <circle cx="380" cy="43" r="4" fill="#D7FF3A"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="396" y="48" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="13" fill="#868b98">file:///index.html</text>

    <!-- rail -->
    <rect x="20" y="66" width="90" height="614" fill="#1b1d23"/>
    <text x="65" y="108" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="26" fill="#ECE8DF">FLIP<tspan fill="#D7FF3A">/</tspan></text>
    <rect x="43" y="180" width="44" height="260" rx="22" fill="#14161b"/>
    <g font-family="Impact,'Arial Black',sans-serif" font-size="15" fill="#868b98" text-anchor="middle">
      <text x="65" y="214">01</text><text x="65" y="314">02</text><text x="65" y="414">03</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 100;0 100;0 200;0 200;0 0" keyTimes="0;.15;.3;.55;.7;.9;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1"/>
      <circle cx="65" cy="205" r="20" fill="#D7FF3A" filter="url(#gl)" opacity=".5"/>
      <circle cx="65" cy="205" r="20" fill="#D7FF3A"/>
      <circle cx="65" cy="205" r="9" fill="none" stroke="#111214" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
    <text x="65" y="640" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="10" letter-spacing="2" fill="#868b98"><tspan fill="#D7FF3A" font-weight="700">100%</tspan> LOCAL</text>

    <!-- ticker -->
    <rect x="110" y="86" width="1070" height="34" fill="#1b1d23"/>
    <g clip-path="url(#tk)" font-family="Impact,'Arial Black',sans-serif" font-size="14" letter-spacing="1.4" fill="#868b98">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-700 0" dur="14s" repeatCount="indefinite"/>
        <text x="130" y="109">HEIC &#8594; JPG <tspan fill="#D7FF3A">/</tspan> PNG &#8594; WEBP <tspan fill="#D7FF3A">/</tspan> AVIF &#8594; PNG <tspan fill="#D7FF3A">/</tspan> WEBP &#8594; JPG <tspan fill="#D7FF3A">/</tspan> HEIF &#8594; PNG <tspan fill="#D7FF3A">/</tspan> GIF &#8594; JPG <tspan fill="#D7FF3A">/</tspan> BMP &#8594; WEBP <tspan fill="#D7FF3A">/</tspan> HEIC &#8594; JPG <tspan fill="#D7FF3A">/</tspan> PNG &#8594; WEBP <tspan fill="#D7FF3A">/</tspan> AVIF &#8594; PNG <tspan fill="#D7FF3A">/</tspan> WEBP &#8594; JPG</text>
      </g>
    </g>

    <!-- ghost number -->
    <text x="1150" y="660" text-anchor="end" font-family="Impact,'Arial Black',sans-serif" font-size="460" fill="none" stroke="#ECE8DF" stroke-opacity=".05" stroke-width="2">01</text>

    <!-- left: headline -->
    <rect x="150" y="146" width="236" height="30" rx="15" fill="#1b1d23" stroke="#292c35" stroke-width="2"/>
    <circle cx="168" cy="161" r="4" fill="#D7FF3A"><animate attributeName="r" values="4;2.5;4" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="182" y="165" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#868b98">IMAGE FORMAT CONVERTER</text>
    <g font-family="Impact,'Arial Black',sans-serif" font-size="92">
      <text x="148" y="266" fill="#ECE8DF">DROP IT.</text>
      <text x="148" y="350" fill="#D7FF3A">FLIP IT.</text>
      <text x="148" y="434" fill="none" stroke="#ECE8DF" stroke-width="2.4">TAKE IT.</text>
    </g>
    <text x="150" y="486" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="15" fill="#b9bcc6">Everything happens right here in your browser.</text>
    <text x="150" y="508" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="15" fill="#b9bcc6">Your photos never leave your device.</text>

    <!-- right: drop zone -->
    <g transform="translate(640 146)">
      <rect width="500" height="240" rx="30" fill="#14161b"/>
      <rect x="10" y="10" width="480" height="220" rx="22" fill="none" stroke="#5b5f6b" stroke-width="1.8" stroke-dasharray="7 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-170" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#5b5f6b;#5b5f6b;#D7FF3A;#D7FF3A;#5b5f6b" keyTimes="0;.05;.12;.3;.4" dur="8s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(250 82)">
        <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite"/>
          <circle r="34" fill="#1b1d23" stroke="#292c35" stroke-width="2"/>
          <g stroke="#D7FF3A" stroke-width="3.5" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="0;0;90;90;0" keyTimes="0;.05;.15;.9;1" dur="8s" repeatCount="indefinite"/>
            <path d="M0 -13v26M-13 0h26"/>
          </g>
        </g>
      </g>
      <text x="250" y="160" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="30" fill="#ECE8DF">DROP FILES HERE</text>
      <g font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">
        <rect x="132" y="184" width="46" height="22" rx="11" fill="#D7FF3A"/><text x="155" y="199" text-anchor="middle" fill="#111214">HEIC</text>
        <rect x="186" y="184" width="46" height="22" rx="11" fill="#1b1d23" stroke="#292c35"/><text x="209" y="199" text-anchor="middle" fill="#b9bcc6">PNG</text>
        <rect x="240" y="184" width="46" height="22" rx="11" fill="#1b1d23" stroke="#292c35"/><text x="263" y="199" text-anchor="middle" fill="#b9bcc6">WEBP</text>
        <rect x="294" y="184" width="46" height="22" rx="11" fill="#1b1d23" stroke="#292c35"/><text x="317" y="199" text-anchor="middle" fill="#b9bcc6">AVIF</text>
      </g>
    </g>

    <!-- polaroids dropping in, staggered loop -->
    <g>
      <g transform="translate(660 400)">
        <g><animateTransform attributeName="transform" type="translate" values="0 -260;0 -260;0 0;0 0;0 40" keyTimes="0;.06;.16;.9;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 1.5 .5 1;0 0 1 1;.5 0 1 1"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.06;.1;.9;1" dur="8s" repeatCount="indefinite"/>
        <g transform="rotate(-5)"><rect width="104" height="128" fill="#EFE9DC"/><rect x="8" y="8" width="88" height="88" fill="#C9A877"/>
          <text x="52" y="62" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="26" fill="#111214">HEIC</text>
          <rect x="30" y="-8" width="44" height="16" fill="#EFE9DC" fill-opacity=".6" transform="rotate(-4)"/>
          <text x="10" y="116" font-family="'Comic Sans MS',cursive" font-size="11" fill="#111214">IMG_4021.heic</text></g></g></g>
      <g transform="translate(790 404)">
        <g><animateTransform attributeName="transform" type="translate" values="0 -260;0 -260;0 0;0 0;0 40" keyTimes="0;.1;.2;.9;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 1.5 .5 1;0 0 1 1;.5 0 1 1"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.14;.9;1" dur="8s" repeatCount="indefinite"/>
        <g transform="rotate(4)"><rect width="104" height="128" fill="#EFE9DC"/><rect x="8" y="8" width="88" height="88" fill="#FF8FC7"/>
          <text x="52" y="62" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="26" fill="#111214">WEBP</text>
          <rect x="30" y="-8" width="44" height="16" fill="#EFE9DC" fill-opacity=".6" transform="rotate(3)"/>
          <text x="10" y="116" font-family="'Comic Sans MS',cursive" font-size="11" fill="#111214">banner.webp</text></g></g></g>
      <g transform="translate(920 400)">
        <g><animateTransform attributeName="transform" type="translate" values="0 -260;0 -260;0 0;0 0;0 40" keyTimes="0;.14;.24;.9;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 1.5 .5 1;0 0 1 1;.5 0 1 1"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.14;.18;.9;1" dur="8s" repeatCount="indefinite"/>
        <g transform="rotate(-3)"><rect width="104" height="128" fill="#EFE9DC"/><rect x="8" y="8" width="88" height="88" fill="#4D7CFF"/>
          <text x="52" y="62" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="26" fill="#EFE9DC">AVIF</text>
          <rect x="30" y="-8" width="44" height="16" fill="#EFE9DC" fill-opacity=".6" transform="rotate(-6)"/>
          <text x="10" y="116" font-family="'Comic Sans MS',cursive" font-size="11" fill="#111214">sunset.avif</text></g></g></g>
    </g>

    <!-- giant percent that fills with volt -->
    <g font-family="Impact,'Arial Black',sans-serif" font-size="150" text-anchor="end">
      <text x="1140" y="560" fill="none" stroke="#ECE8DF" stroke-opacity=".5" stroke-width="2">100%</text>
      <g clip-path="url(#fillclip)"><text x="1140" y="560" fill="#D7FF3A">100%</text></g>
    </g>

    <!-- CTA -->
    <g transform="translate(150 560)">
      <rect width="440" height="76" rx="38" fill="#D7FF3A"/>
      <rect width="440" height="76" rx="38" fill="#D7FF3A" filter="url(#gl)" opacity=".35"><animate attributeName="opacity" values=".15;.5;.15" dur="2s" repeatCount="indefinite"/></rect>
      <text x="34" y="46" font-family="Impact,'Arial Black',sans-serif" font-size="30" fill="#111214">FLIP 3 FILES</text>
      <text x="34" y="64" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2.4" fill="#111214" fill-opacity=".65">TO JPG</text>
      <g transform="translate(378 38)">
        <circle r="28" fill="#111214"/>
        <g stroke="#D7FF3A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.1s" repeatCount="indefinite"/>
          <path d="M-10 0h20M3 -7l7 7-7 7"/>
        </g>
      </g>
    </g>
  </g>
</svg>
